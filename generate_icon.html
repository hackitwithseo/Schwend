<!DOCTYPE html>
<html>
<body>
<canvas id="canvas" width="128" height="128"></canvas>
<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  // Instagram Gradient Background
  const grad = ctx.createLinearGradient(0, 128, 128, 0);
  grad.addColorStop(0, '#f09433');
  grad.addColorStop(0.25, '#e6683c');
  grad.addColorStop(0.5, '#dc2743');
  grad.addColorStop(0.75, '#cc2366');
  grad.addColorStop(1, '#bc1888');

  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.roundRect(0, 0, 128, 128, 28);
  ctx.fill();

  // Draw 'S' paperplane icon
  ctx.strokeStyle = '#ffffff';
  ctx.lineWidth = 9;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  ctx.beginPath();
  ctx.moveTo(104, 80);
  ctx.lineTo(104, 96);
  ctx.arcTo(104, 106, 94, 106, 10);
  ctx.lineTo(34, 106);
  ctx.arcTo(24, 106, 24, 96, 10);
  ctx.lineTo(24, 80);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(88, 44);
  ctx.lineTo(64, 20);
  ctx.lineTo(40, 44);
  ctx.moveTo(64, 20);
  ctx.lineTo(64, 76);
  ctx.stroke();

  // Auto download icon.png
  const a = document.createElement('a');
  a.download = 'icon.png';
  a.href = canvas.toDataURL('image/png');
  a.click();
</script>
</body>
</html>
